[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-remover"
version = "0.1.0"
description = "Local Windows tool for AI object removal on large images (TIFF/JPG)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.2",
    "tifffile>=2024.1.1",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.gui-scripts]
object-remover = "object_remover.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
